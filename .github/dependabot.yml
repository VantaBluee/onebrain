# Grouped, monthly, and quiet: every Dependabot PR runs the full 5-OS CI
# matrix, which is expensive on a private repo. Majors for cargo deps are
# deliberate upgrades done by hand (semver-major API churn), not bot PRs.
#
# vendor/llama.cpp (gitsubmodule ecosystem) is deliberately NOT tracked:
# engine bumps couple to the build-hash handshake and are always manual.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-all:
        patterns: ["*"]
