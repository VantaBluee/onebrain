# OneBrain CI — M0 Definition of Done: green matrix on macOS/Linux/Windows,
# `onebrain --version` artifacts for all three OSes.
#
# Warnings policy: CI enforces RUSTFLAGS=-Dwarnings (job-level env); local
# builds stay permissive.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, ubuntu-22.04, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    # 75 (was 60): the M5 chaos section adds ~3 min of sim wall time (three
    # daemons, kill/retry streams, rejoin polling) on the slowest runners.
    timeout-minutes: 75
    env:
      RUSTFLAGS: -Dwarnings
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (with vendored llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable Rust (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The llama.cpp CMake build lands in target/ via the cmake crate's
      # OUT_DIR, so rust-cache covers it too. cmake and a C++ toolchain are
      # preinstalled on all these runners; ccache is deliberately skipped.
      # key MUST separate ubuntu versions: both are "Linux" to rust-cache,
      # and artifacts built against 24.04's glibc fail to link on 22.04
      # (__isoc23_* symbols).
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      # `cargo xtask smoke` downloads a tiny GGUF into target-smoke/ and runs
      # the CPU smoke inference test. Cache the model, keyed on the download
      # URLs (hashing the xtask source that declares them).
      - name: Cache smoke-test model
        uses: actions/cache@v4
        with:
          path: target-smoke
          key: smoke-gguf-${{ hashFiles('xtask/src/smoke.rs') }}

      - name: Smoke inference (tiny GGUF, CPU)
        run: cargo xtask smoke

      # The M1 DoD rehearsal, per OS: sandboxed daemon, both API dialects
      # streaming real tokens, kill -9 recovery, graceful stop. The Build
      # step above already compiled everything (OB_E2E_SKIP_BUILD).
      - name: End-to-end rehearsal (daemon + both API dialects)
        run: cargo xtask e2e
        env:
          OB_E2E_SKIP_BUILD: "1"

      # The M2 DoD rehearsal, per OS: two sandboxed daemons (mDNS/relays
      # disabled) pair through the internal API with ticket + code, both
      # report the peer connected with RTT/bandwidth, and unpair degrades
      # the link. mDNS itself is NOT exercised in CI (multicast is
      # unreliable on hosted runners; it is on the manual checklist).
      - name: Pair-sim rehearsal (two daemons, mesh pairing)
        run: cargo xtask pair-sim
        env:
          OB_E2E_SKIP_BUILD: "1"

      # The M3 DoD rehearsal, per OS: two memory-capped daemons auto-engage
      # PipelineParallel on the tiny GGUF (already cached in target-smoke by
      # the smoke step), greedy tokens match an uncapped solo run
      # byte-for-byte, a socket scan proves loopback-only listeners, and
      # --nodes 2 forces distribution.
      - name: Cluster-sim rehearsal (distributed inference)
        run: cargo xtask sim
        env:
          OB_E2E_SKIP_BUILD: "1"

  # M2 netem leg (docs/mesh.md): the pair-sim scenario with each daemon in
  # its own network namespace, the veth pair between them shaped by tc netem
  # to 1 Gbit / 0.5 ms per direction; asserts the probed bandwidth lands in
  # [500, 1100] Mbps and the heartbeat RTT in [0.4, 3.0] ms. Root is needed
  # for `ip netns`/`tc`, so the workspace is prebuilt as the runner user
  # (keeping ~/.cargo and target/ runner-owned for rust-cache) and only the
  # sim runs under sudo (-E preserves HOME/CARGO env; PATH is re-injected
  # because sudo resets it even with -E).
  pair-sim-netem:
    name: pair-sim-netem
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: -Dwarnings
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (with vendored llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Prebuild (as the runner user, so caches stay runner-owned)
        run: |
          cargo build --workspace --exclude xtask
          cargo build -p xtask

      # The cluster sim needs the tiny GGUF; restore it from the same cache
      # the test job populates (keyed on the URLs declared in smoke.rs) so a
      # cache hit avoids downloading as root.
      - name: Cache smoke-test model
        uses: actions/cache@v4
        with:
          path: target-smoke
          key: smoke-gguf-${{ hashFiles('xtask/src/smoke.rs') }}

      # OB_E2E_SKIP_BUILD is essential here: an inner build under sudo
      # would write root-owned artifacts into the runner-owned cache.
      - name: Pair-sim under netem (1 Gbit / 0.5 ms namespaces)
        run: sudo -E env PATH=$PATH OB_E2E_SKIP_BUILD=1 cargo xtask pair-sim --netem

      # M3 netem leg (docs/distributed.md): the cluster-sim scenario with
      # each daemon in its own namespace at 1 Gbit / 0.5 ms.
      - name: Cluster sim under netem (1 Gbit / 0.5 ms namespaces)
        run: sudo -E env PATH=$PATH OB_E2E_SKIP_BUILD=1 cargo xtask sim --netem

  # Compile-only proof that the GPU backend features build on every platform
  # that supports them. These must be green per the spec (no continue-on-error).
  gpu-compile:
    name: gpu-compile (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-vulkan
            os: ubuntu-22.04
            vulkan: true
            features: vulkan
          - name: linux-cuda
            os: ubuntu-22.04
            cuda: true
            features: cuda
          - name: windows-cuda-vulkan
            os: windows-2022
            cuda: true
            vulkan: true
            features: cuda vulkan
          - name: macos-metal
            os: macos-15
            features: metal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    continue-on-error: false
    env:
      RUSTFLAGS: -Dwarnings
      # Compile-proof economy: one CUDA arch instead of llama.cpp's broad
      # default list (which exceeds 90 min on 2-core runners). Release
      # artifact builds do NOT set this.
      OB_CUDA_ARCHS: "86"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (with vendored llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # MSBuild's FileTracker still enforces MAX_PATH; the Vulkan shader
      # generator's ExternalProject nests deep enough inside cargo's OUT_DIR
      # to blow past 260 chars (FTK1011). A short target dir fixes it.
      - name: Shorten target dir (Windows path-length limit)
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=D:\t" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK (Linux, LunarG apt repo)
        if: matrix.vulkan && runner.os == 'Linux'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y vulkan-sdk

      # LunarG retires old point releases from the CDN (pinned versions rot
      # into 404s), so resolve the current version at install time.
      - name: Install Vulkan SDK (Windows, silent installer)
        if: matrix.vulkan && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Invoke-RestMethod "https://vulkan.lunarg.com/sdk/latest/windows.txt").ToString().Trim()
          Write-Host "Vulkan SDK version: $ver"
          curl.exe -L --fail --retry 3 -o "$env:RUNNER_TEMP\vulkan-sdk-installer.exe" "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\vulkan-sdk-installer.exe" -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -NoNewWindow -Wait
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$ver"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$ver\Bin"

      - name: Install CUDA toolkit 12.x (Linux, network method)
        if: matrix.cuda && runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.4.1"
          method: network
          sub-packages: '["nvcc", "cudart"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'

      - name: Install CUDA toolkit 12.x (Windows, network method)
        if: matrix.cuda && runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.4.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      - name: cargo check GPU features
        run: |
          for feature in ${{ matrix.features }}; do
            echo "::group::cargo check -p onebrain-engine --features ${feature}"
            cargo check -p onebrain-engine --features "${feature}"
            echo "::endgroup::"
          done

  # M0 security checklist: cargo audit / cargo deny in CI. audit runs now;
  # deny is wired below (commented) for when deny.toml lands at the repo root.
  lint-deps:
    name: lint-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

      # Enable once deny.toml exists at the repo root:
      # - name: Install cargo-deny
      #   uses: taiki-e/install-action@v2
      #   with:
      #     tool: cargo-deny
      # - name: cargo deny
      #   run: cargo deny check

  # Per-OS `onebrain --version` artifacts (M0 DoD).
  dist:
    name: dist (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: -Dwarnings
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (with vendored llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: cargo xtask dist
        run: cargo xtask dist

      - name: Verify staged binary runs (--version)
        run: |
          bin="$(find dist -type f \( -name onebrain -o -name onebrain.exe \) | head -n 1)"
          test -n "$bin"
          "$bin" --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onebrain-${{ matrix.os }}
          path: dist/**
          if-no-files-found: error

  # M8 §5 rehearsal: build every installer artifact exactly as release.yml
  # will — .msi on Windows, .deb + .rpm on Ubuntu, the release tarball/zip
  # everywhere — on PRs and main, WITHOUT publishing anything, so a tag
  # never discovers WiX/deb/rpm config rot or installer-script breakage
  # first. Deliberately mirrors release.yml's dist job step-for-step
  # (including NO -Dwarnings: the test job owns the warnings gate; this job
  # rehearses the release build as it will actually run).
  release-dry-run:
    name: release-dry-run (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (with vendored llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Same MAX_PATH mitigation as the gpu-compile job / release.yml.
      - name: Shorten target dir (Windows path-length limit)
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=D:\t" >> "$GITHUB_ENV"

      # No tag here, so the workspace version stands in for it (release.yml
      # asserts the two agree at tag time). cargo pkgid output is
      # ...#name@x.y.z, or ...#x.y.z when the dir name matches the package.
      - name: Resolve workspace version
        id: version
        run: |
          id="$(cargo pkgid -p onebrain-cli)"
          ver="${id##*#}"
          ver="${ver##*@}"
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"

      - name: cargo xtask dist
        run: cargo xtask dist

      - name: Package archive (as release.yml will)
        run: |
          mkdir -p dist/upload
          cd dist
          target="$(rustc -vV | sed -n 's/host: //p')"
          stage="onebrain-v${{ steps.version.outputs.ver }}-${target}"
          test -d "$stage"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "upload/${stage}.zip" "$stage"
          else
            tar -czf "upload/${stage}.tar.gz" "$stage"
          fi

      # WiX v4 pinned to the 4.x line, exactly as release.yml does. The MSI
      # ProductVersion must be numeric x.y.z (prerelease suffix stripped).
      - name: Build .msi (WiX v4, dry run)
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 4.0.5
          ver="${{ steps.version.outputs.ver }}"
          msi_ver="${ver%%-*}"
          target="$(rustc -vV | sed -n 's/host: //p')"
          wix build -arch x64 \
            -d Version="$msi_ver" \
            -d BinDir="dist/onebrain-v${ver}-${target}" \
            wix/onebrain.wxs \
            -o "dist/upload/onebrain-v${ver}-${target}.msi"

      # deb/rpm from [package.metadata.*] in crates/onebrain-cli/Cargo.toml;
      # --no-build reuses the release binary xtask dist just built.
      - name: Build .deb and .rpm (dry run)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb -p onebrain-cli --no-build -o dist/upload/
          cargo generate-rpm -p crates/onebrain-cli -o dist/upload/

      # shellcheck is preinstalled on ubuntu runners; the installer script
      # must stay clean (product.md DoD).
      - name: Lint install.sh (bash -n + shellcheck)
        if: runner.os == 'Linux'
        run: |
          bash -n install.sh
          shellcheck install.sh

      # Formula syntax gate (ruby ships on the macOS runners). Real formula
      # audits need a tap; syntax rot is what bites first.
      - name: Validate Homebrew formula (ruby -c)
        if: runner.os == 'macOS'
        run: ruby -c Formula/onebrain.rb

      - name: Upload dry-run installers
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ matrix.os }}
          path: dist/upload/*
          if-no-files-found: error
          retention-days: 7
