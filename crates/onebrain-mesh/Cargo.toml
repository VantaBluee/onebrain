[package]
name = "onebrain-mesh"
description = "Device identity, pairing, discovery, and authenticated transport (iroh)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
onebrain-proto = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
iroh = { workspace = true }
# Not in [workspace.dependencies]: onebrain-mesh is its only consumer, and the
# root manifest is shared with concurrently developed crates. 0.103 is the
# newest release tracking iroh ^1.0 (verified on crates.io); its default
# `fs-store` feature backs the on-disk range-blob store.
iroh-blobs = "0.103"
iroh-tickets = { workspace = true }
iroh-mdns-address-lookup = { workspace = true }
spake2 = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Proves the hash identity the M6 contract rests on: iroh-blobs addresses a
# blob by the plain BLAKE3 of its content, i.e. our range-manifest hashes.
blake3 = { workspace = true }
