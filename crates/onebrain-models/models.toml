# OneBrain curated model registry (embedded into the binary via include_str!).
#
# Schema per entry — the table key is the model id:
#   display_name        human-readable name shown by `onebrain ls` / the dashboard
#   url                 direct GGUF download (HTTPS); for split models the
#                       FIRST part (`-00001-of-000NN.gguf`) — the downloader
#                       derives the sibling part URLs from it
#   file_name           the on-disk file name inside <data_dir>/models/<id>/
#   license             upstream model license (recorded, not enforced)
#   min_memory_mb       minimum usable memory on ONE node to load solo at the
#                       recommended context
#
# Optional fields (absent = the stated default; docs/logistics.md
# "Registry v1"):
#   recommended_ctx     recommended context length in tokens (default 8192)
#   parts               split-GGUF part count (default 1 = single file)
#   moe_total_params    MoE only: total parameter count (absent = dense)
#   moe_active_params   MoE only: parameters active per token (absent = dense)
#   min_pooled_memory_mb  minimum POOLED memory across the cluster to load at
#                       the recommended context. Filled conservatively as
#                       file_size_mb * 1.2 + 2048 MB ctx headroom, rounded up
#                       to a whole GiB (file GB read as GiB, which slightly
#                       over-provisions — deliberate).
#
# Every URL below was verified to answer HTTP 200 without a license gate on
# 2026-08-27.

